<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta id="theme-meta" name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Calculator</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png">
  <link rel="apple-touch-icon" href="./icon-512.png">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="toast" id="toast">Copied</div>

  <div class="app">
    <div class="header">
      <button onclick="toggleHistory(true)">History</button>
      <div class="title-group">
        <span>Calculator</span>
        <button id="sound-btn" onclick="toggleSound()" aria-label="Toggle sound">🔊</button>
      </div>
      <button onclick="copyResult()">Copy</button>
    </div>

    <div class="display" id="display-area">
      <div id="expression"></div>
      <div id="display">0</div>
      <div id="live-preview"></div>
    </div>

    <div class="keys">
      <button class="key gray" id="clear-btn" onclick="handleClear()">AC</button>
      <button class="key gray" onclick="sign()">+/−</button>
      <button class="key gray" onclick="percent()">%</button>
      <button class="key orange" data-op="÷" onclick="op('÷')">÷</button>

      <button class="key" onclick="num('7')">7</button>
      <button class="key" onclick="num('8')">8</button>
      <button class="key" onclick="num('9')">9</button>
      <button class="key orange" data-op="×" onclick="op('×')">×</button>

      <button class="key" onclick="num('4')">4</button>
      <button class="key" onclick="num('5')">5</button>
      <button class="key" onclick="num('6')">6</button>
      <button class="key orange" data-op="−" onclick="op('−')">−</button>

      <button class="key" onclick="num('1')">1</button>
      <button class="key" onclick="num('2')">2</button>
      <button class="key" onclick="num('3')">3</button>
      <button class="key orange" data-op="+" onclick="op('+')">+</button>

      <button class="key zero" onclick="num('0')">0</button>
      <button class="key" onclick="decimal()">.</button>
      <button class="key orange" onclick="equal()">=</button>
    </div>

    <div class="home"><span></span></div>
  </div>

  <div class="history-modal" id="history-modal" onclick="if(event.target===this)toggleHistory(false)">
    <div class="history-sheet">
      <div class="history-top">
        <button style="background:none;border:none;color:#ff453a;font-size:15px" onclick="clearHistory()">Clear</button>
        <span>History</span>
        <button style="background:none;border:none;color:var(--op-bg);font-size:15px" onclick="toggleHistory(false)">Done</button>
      </div>
      <div class="history-list" id="history-list"></div>
    </div>
  </div>

  <script src="./app.js"></script>
</body>
</html>
