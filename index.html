  <script>
    // --- 1. System Dark/Light Theme Synchronization ---
    const darkMediaQuery = window.matchMedia('(prefers-color-scheme: dark)');

    function syncThemeColor(isDark) {
      const color = isDark ? '#000000' : '#f2f2f7';
      document.querySelectorAll('meta[name="theme-color"]').forEach((tag) => {
        if (!tag.media) tag.setAttribute('content', color);
      });
    }

    syncThemeColor(darkMediaQuery.matches);
    darkMediaQuery.addEventListener('change', (e) => syncThemeColor(e.matches));

    // --- 2. Service Worker Registration for Offline Standalone PWA ---
    if ('serviceWorker' in navigator && (window.location.protocol === 'https:' || window.location.hostname === 'localhost')) {
      window.addEventListener('load', () => {
        const swCode = `
          const CACHE_NAME = 'ios-calc-pwa-v1';
          self.addEventListener('install', (event) => {
            self.skipWaiting();
            event.waitUntil(
              caches.open(CACHE_NAME).then((cache) => cache.addAll(['./']))
            );
          });
          self.addEventListener('activate', (event) => {
            event.waitUntil(self.clients.claim());
          });
          self.addEventListener('fetch', (event) => {
            event.respondWith(
              fetch(event.request)
                .then((response) => {
                  const clone = response.clone();
                  caches.open(CACHE_NAME).then((cache) => cache.put(event.request, clone));
                  return response;
                })
                .catch(() => caches.match(event.request))
            );
          });
        `;
        try {
          const swBlob = new Blob([swCode], { type: 'application/javascript' });
          const swUrl = URL.createObjectURL(swBlob);
          navigator.serviceWorker.register(swUrl).catch(() => {});
        } catch (err) {
          // Ignore in restricted preview contexts
        }
      });
    }

    // --- 3. Calculator State & Persistent History ---
    const HISTORY_STORAGE_KEY = 'ios_calculator_history_v1';
    let val = '0';
    let old = null;
    let operator = null;
    let reset = false;
    let isError = false;
    let historyItems = [];

    try {
      const saved = localStorage.getItem(HISTORY_STORAGE_KEY);
      if (saved) historyItems = JSON.parse(saved);
    } catch (e) {
      historyItems = [];
    }

    function saveHistory() {
      try {
        localStorage.setItem(HISTORY_STORAGE_KEY, JSON.stringify(historyItems));
      } catch (e) {}
    }

    const displayEl = document.getElementById('display');
    const displayAreaEl = document.getElementById('displayArea');
    const exprEl = document.getElementById('expression');
    const acBtn = document.getElementById('acBtn');
    const opButtons = document.querySelectorAll('.btn-op[data-op]');

    // Format number with commas while preserving trailing decimals & zeros while typing
    function formatDisplay(raw) {
      if (raw === 'Error') return 'Error';
      if (raw === '-' || raw === '-0') return raw;

      const isNegative = raw.startsWith('-');
      const unsigned = isNegative ? raw.slice(1) : raw;
      const [intPartRaw, decPart] = unsigned.split('.');
      const intPart = intPartRaw || '0';

      if (intPart.includes('e') || (decPart && decPart.includes('e'))) {
        return Number(raw).toExponential(6);
      }

      const formattedInt = Number(intPart).toLocaleString('en-US');
      const prefix = isNegative ? '-' : '';
      return decPart !== undefined ? `${prefix}${formattedInt}.${decPart}` : `${prefix}${formattedInt}`;
    }

    // Auto-scale display font size so long comma-formatted numbers never clip
    function adjustFontSize(formattedText) {
      const len = formattedText.length;
      if (len <= 6) {
        displayEl.style.fontSize = '88px';
        displayEl.style.letterSpacing = '-2px';
      } else if (len <= 8) {
        displayEl.style.fontSize = '70px';
        displayEl.style.letterSpacing = '-1.5px';
      } else if (len <= 10) {
        displayEl.style.fontSize = '56px';
        displayEl.style.letterSpacing = '-1px';
      } else if (len <= 13) {
        displayEl.style.fontSize = '44px';
        displayEl.style.letterSpacing = '-0.5px';
      } else if (len <= 16) {
        displayEl.style.fontSize = '36px';
        displayEl.style.letterSpacing = '0px';
      } else {
        displayEl.style.fontSize = '30px';
        displayEl.style.letterSpacing = '0px';
      }
    }

    // Highlight active operator pill when awaiting second operand
    function updateOperatorHighlight() {
      opButtons.forEach((btn) => {
        if (operator && reset && btn.dataset.op === operator) {
          btn.classList.add('is-active');
        } else {
          btn.classList.remove('is-active');
        }
      });
    }

    function render() {
      const formatted = formatDisplay(val);
      displayEl.textContent = formatted;
      adjustFontSize(formatted);
      acBtn.textContent = (val !== '0' || isError) ? 'C' : 'AC';
      updateOperatorHighlight();
    }

    // Eliminate IEEE-754 floating-point drift (e.g., 0.1 + 0.2 -> 0.3)
    function cleanFloat(num) {
      return Math.round(num * 1e10) / 1e10;
    }

    function handleDigit(digit) {
      if (isError) {
        val = '0';
        old = null;
        operator = null;
        reset = false;
        isError = false;
        exprEl.textContent = '';
      }

      if (reset) {
        val = digit;
        reset = false;
      } else if (val === '0') {
        val = digit;
      } else if (val === '-0') {
        val = '-' + digit;
      } else {
        const digitCount = val.replace(/[^0-9]/g, '').length;
        if (digitCount < 15) {
          val += digit;
        }
      }
      render();
    }

    function handleDecimal() {
      if (isError) {
        val = '0.';
        old = null;
        operator = null;
        reset = false;
        isError = false;
        exprEl.textContent = '';
        render();
        return;
      }

      if (reset) {
        val = '0.';
        reset = false;
      } else if (!val.includes('.')) {
        val += '.';
      }
      render();
    }

    function handleClear() {
      if (val !== '0' && !isError && operator !== null && !reset) {
        val = '0';
        reset = true;
      } else {
        val = '0';
        old = null;
        operator = null;
        reset = false;
        isError = false;
        exprEl.textContent = '';
      }
      render();
    }

    function handleSign() {
      if (isError || val === '0') return;
      val = val.startsWith('-') ? val.slice(1) : '-' + val;
      reset = false;
      render();
    }

    function handlePercent() {
      if (isError) return;
      const result = cleanFloat(Number(val) / 100);
      val = String(result);
      reset = false;
      render();
    }

    function handleBackspace() {
      if (isError) {
        handleClear();
        return;
      }
      if (reset) return;
      if (val.length <= 1 || (val.length === 2 && val.startsWith('-'))) {
        val = '0';
      } else {
        val = val.slice(0, -1);
      }
      render();
    }

    function handleOperator(nextOp) {
      if (isError) {
        val = '0';
        old = null;
        operator = null;
        reset = false;
        isError = false;
        exprEl.textContent = '';
      }

      if (operator && !reset) {
        evaluate(false);
        if (isError) return;
      }

      old = Number(val);
      operator = nextOp;
      reset = true;
      exprEl.textContent = `${formatDisplay(String(old))} ${operator}`;
      render();
    }

    function handleEquals() {
      evaluate(true);
    }

    function evaluate(recordHistory) {
      if (old === null || !operator || isError) return;

      const a = old;
      const b = Number(val);
      const equationText = `${formatDisplay(String(a))} ${operator} ${formatDisplay(String(b))}`;
      let result;

      if (operator === '+') result = a + b;
      else if (operator === '−') result = a - b;
      else if (operator === '×') result = a * b;
      else if (operator === '÷') {
        if (b === 0) {
          isError = true;
          val = 'Error';
          old = null;
          operator = null;
          reset = true;
          exprEl.textContent = equationText;
          render();
          return;
        }
        result = a / b;
      }

      result = cleanFloat(result);

      if (!Number.isFinite(result)) {
        isError = true;
        val = 'Error';
        old = null;
        operator = null;
        reset = true;
        exprEl.textContent = equationText;
        render();
        return;
      }

      const resultStr = String(result);
      exprEl.textContent = `${equationText} =`;

      if (recordHistory) {
        historyItems.unshift({
          expression: equationText,
          result: resultStr
        });
        if (historyItems.length > 50) historyItems.pop();
        saveHistory();
        renderHistory();
      }

      val = resultStr;
      old = null;
      operator = null;
      reset = true;
      render();
    }

    // --- 4. iOS Swipe-to-Delete Gesture on Display ---
    let touchStartX = 0;
    let touchStartY = 0;

    displayAreaEl.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1) {
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
      }
    }, { passive: true });

    displayAreaEl.addEventListener('touchend', (e) => {
      if (e.changedTouches.length === 1) {
        const deltaX = e.changedTouches[0].clientX - touchStartX;
        const deltaY = e.changedTouches[0].clientY - touchStartY;
        if (Math.abs(deltaX) > 36 && Math.abs(deltaX) > Math.abs(deltaY) * 1.5) {
          handleBackspace();
        }
      }
    }, { passive: true });

    // --- 5. Copy to Clipboard with Toast ---
    let copiedTimer;
    function copyDisplay() {
      const textToCopy = isError ? '0' : formatDisplay(val);
      const textarea = document.createElement('textarea');
      textarea.value = textToCopy;
      textarea.setAttribute('readonly', '');
      textarea.style.position = 'fixed';
      textarea.style.opacity = '0';
      document.body.appendChild(textarea);
      textarea.select();

      try {
        document.execCommand('copy');
        const badge = document.getElementById('copiedBadge');
        badge.classList.remove('opacity-0');
        clearTimeout(copiedTimer);
        copiedTimer = setTimeout(() => {
          badge.classList.add('opacity-0');
        }, 1400);
      } catch (err) {
        // Fallback silent ignore
      } finally {
        document.body.removeChild(textarea);
      }
    }

    // --- 6. History Drawer Controls ---
    function openHistory() {
      renderHistory();
      document.getElementById('historyBackdrop').classList.remove('hidden');
      const sheet = document.getElementById('historySheet');
      sheet.classList.remove('translate-y-full');
      sheet.setAttribute('aria-hidden', 'false');
    }

    function closeHistory() {
      document.getElementById('historyBackdrop').classList.add('hidden');
      const sheet = document.getElementById('historySheet');
      sheet.classList.add('translate-y-full');
      sheet.setAttribute('aria-hidden', 'true');
    }

    function clearHistory() {
      historyItems = [];
      saveHistory();
      renderHistory();
    }

    function selectHistoryItem(index) {
      const item = historyItems[index];
      if (!item) return;
      val = item.result;
      isError = false;
      reset = false;
      exprEl.textContent = item.expression + ' =';
      render();
      closeHistory();
    }

    function renderHistory() {
      const listEl = document.getElementById('historyList');
      if (historyItems.length === 0) {
        listEl.innerHTML = '<p class="text-center text-secondary text-sm py-12">No History</p>';
        return;
      }

      listEl.innerHTML = historyItems
        .map(
          (item, idx) => `
          <button
            type="button"
            onclick="selectHistoryItem(${idx})"
            class="history-item w-full py-2.5 px-3.5 rounded-2xl transition text-right flex flex-col items-end"
          >
            <span class="text-[14px] text-secondary font-light">${item.expression}</span>
            <span class="text-[24px] font-normal tracking-tight">${formatDisplay(item.result)}</span>
          </button>
        `
        )
        .join('');
    }

    // --- 7. Full Keyboard Support ---
    window.addEventListener('keydown', (e) => {
      if (e.key >= '0' && e.key <= '9') {
        e.preventDefault();
        handleDigit(e.key);
      } else if (e.key === '.') {
        e.preventDefault();
        handleDecimal();
      } else if (e.key === '+') {
        e.preventDefault();
        handleOperator('+');
      } else if (e.key === '-') {
        e.preventDefault();
        handleOperator('−');
      } else if (e.key === '*') {
        e.preventDefault();
        handleOperator('×');
      } else if (e.key === '/') {
        e.preventDefault();
        handleOperator('÷');
      } else if (e.key === 'Enter' || e.key === '=') {
        e.preventDefault();
        handleEquals();
      } else if (e.key === 'Backspace') {
        e.preventDefault();
        handleBackspace();
      } else if (e.key === 'Escape') {
        e.preventDefault();
        if (!document.getElementById('historySheet').classList.contains('translate-y-full')) {
          closeHistory();
        } else {
          handleClear();
        }
      } else if (e.key === '%') {
        e.preventDefault();
        handlePercent();
      }
    });

    // Initial Render
    render();
  </script>
</body>
</html>
